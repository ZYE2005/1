<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />

    <title>دليل الفعاليات</title>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-1" href="#">
            <span class="logo">
              <i class="fa-solid fa-wand-magic-sparkles gold"></i>
              <span class="gold">دليل</span>
            </span>
            <span>الفعاليات</span>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="فتح القائمة"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="/index.html">الرئيسية</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="/events.html">كل الفعاليات</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/about.html">عن الدليل</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/contact.html">اتصل بنا</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="events">
      <section class="events-hero py-5">
        <div class="container">
          <div class="events-content text-center text-md-start">
            <p>كل الفعاليات</p>
            <h1>اكتشف فعاليتك القادمة</h1>
          </div>
        </div>
      </section>

      <section class="events-list py-5">
        <div class="container">
          <div class="filters">
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <select
                  id="categoryFilter"
                  class="form-select"
                  aria-label="التصنيف"
                >
                  <option value="">كل التصنيفات</option>
                  <option value="ثقافة">ثقافة</option>
                  <option value="رياضة">رياضة</option>
                  <option value="موسيقى">موسيقى</option>
                  <option value="عائلي">عائلي</option>
                </select>
              </div>

              <div class="col-12 col-md-4">
                <input
                  id="dateFilter"
                  type="date"
                  class="form-control"
                  aria-label="التاريخ"
                />
              </div>

              <div class="col-12 col-md-4">
                <select
                  id="placeFilter"
                  class="form-select"
                  aria-label="الموقع"
                >
                  <option value="">كل المواقع</option>
                  <option value="المركز الثقافي العربي - أبو رمانة">
                    المركز الثقافي العربي
                  </option>
                  <option value="منتزه الجاحظ - أبو رمانة">منتزه الجاحظ</option>
                  <option value="المعهد العالي للموسيقى">
                    المعهد العالي للموسيقى
                  </option>
                  <option value="مدينة الفيحاء الرياضية">
                    مدينة الفيحاء الرياضية
                  </option>
                  <option value="دار الثقافة والفنون - ساحة الأمويين">
                    دار الثقافة والفنون (الأوبرا) - ساحة الأمويين
                  </option>
                  <option value="حديقة التجارة">حديقة التجارة</option>
                  <option value="مدينة تشرين الرياضية - البرامكة">
                    مدينة تشرين الرياضية
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="events_card pb-5">
        <div class="container">
          <!-- كروت الفعاليات التي يضيفها JavaScript ستظهر هنا -->
        </div>
      </section>
    </main>

    <footer class="py-4">
      <div class="container">
        <div
          class="footer-content row gy-4 align-items-center text-center text-md-start pb-4 mb-3"
        >
          <div class="col-12 col-md-4">
            <img
              class="img-fluid w-50"
              src="/assets/img/logo-white-1.png"
              alt="دليل الفعاليات"
            />
          </div>

          <div
            class="col-12 col-md-4 d-flex flex-column align-items-center gap-2"
          >
            <h5>روابط سريعة</h5>
            <a href="events.html">كل الفعاليات</a>
            <a href="about.html">عن الدليل</a>
            <a href="contact.html">اتصل بنا</a>
          </div>

          <div
            class="col-12 col-md-4 d-flex flex-column align-items-center gap-2"
          >
            <h5>تواصل معنا</h5>
            <p>events@svuonline.org</p>
            <div class="icons d-flex gap-3">
              <i class="fab fa-telegram"></i>
              <i class="fab fa-x-twitter"></i>
              <i class="fab fa-instagram"></i>
              <i class="fab fa-facebook"></i>
            </div>
          </div>
        </div>

        <span class="d-block text-center text-md-start"
          >© 2026 دليل فعاليات الجامعة الافتراضية. جميع الحقوق محفوظة.</span
        >
      </div>
    </footer>

    <div class="topBar">
      <i class="fa-solid fa-arrow-up"></i>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
